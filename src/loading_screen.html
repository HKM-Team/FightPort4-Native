  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700;1,900&family=Share+Tech+Mono&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030611;
      font-family: 'Chakra Petch', sans-serif;
      color: #fff;
    }

    /* Viewport Stage */
    .viewport-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: hidden;
      background: radial-gradient(circle at 60% 40%, #0d1738 0%, #050918 60%, #02040a 100%);
    }

    /* Container 16:9 que se adapta à resolução do monitor */
    .screen-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      aspect-ratio: 16 / 9;
      transform-style: preserve-3d;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.95);
      transition: opacity 0.6s ease-out;
    }

    @keyframes bgBreathing {
      0% {
        transform: scale(1.0) translate(0, 0);
        filter: brightness(0.97) contrast(1.02);
      }
      50% {
        transform: scale(1.02) translate(-0.2%, -0.1%);
        filter: brightness(1.04) contrast(1.06);
      }
      100% {
        transform: scale(1.01) translate(0.2%, 0.2%);
        filter: brightness(0.99) contrast(1.04);
      }
    }

    /* Canvas de Partículas (Névoa de spray e fagulhas neon) */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Camada 2: Texto Superior registrado 1:1 sobre o fundo (MUITO PRÓXIMO e colado) */
    .fg-text-layer {
      position: absolute;
      top: -2%;
      left: -2%;
      width: 104%;
      height: 104%;
      pointer-events: none;
      z-index: 10;
      animation: fgSyncBreathing 6s ease-in-out infinite alternate;
      transition: transform 0.1s ease-out;
    }

    @keyframes fgSyncBreathing {
      0% {
        transform: scale(1.0) translate(0, 0);
      }
      50% {
        /* Deslocamento microscópico de apenas 1.5px para profundidade 3D suave e colada */
        transform: scale(1.022) translate(-0.3%, -0.15%);
      }
      100% {
        transform: scale(1.012) translate(0.25%, 0.25%);
      }
    }

    .glitch-cyan {
      filter: drop-shadow(-3px 0 0 #00ffff);
      mix-blend-mode: screen;
    }

    .glitch-red {
      filter: drop-shadow(3px 0 0 #ff0055);
      mix-blend-mode: screen;
    }

    .screen-wrapper.is-glitching .glitch-cyan {
      animation: glitchAnim1 0.22s steps(2) forwards;
    }
    .screen-wrapper.is-glitching .glitch-red {
      animation: glitchAnim2 0.22s steps(2) forwards;
    }

    @keyframes glitchAnim1 {
      0% { opacity: 0.85; transform: translate(-3px, 1px); clip-path: inset(25% 0 45% 0); }
      50% { opacity: 0.95; transform: translate(3px, -1px); clip-path: inset(55% 0 15% 0); }
      100% { opacity: 0; transform: translate(0, 0); clip-path: inset(0 0 0 0); }
    }

    @keyframes glitchAnim2 {
      0% { opacity: 0.85; transform: translate(3px, -1px); clip-path: inset(40% 0 30% 0); }
      50% { opacity: 0.95; transform: translate(-3px, 1px); clip-path: inset(15% 0 60% 0); }
      100% { opacity: 0; transform: translate(0, 0); clip-path: inset(0 0 0 0); }
    }

    /* BARRA DE CARREGAMENTO (Posicionada Logo Abaixo de "FIGHT PORT 4") */
    .loading-bar-unit {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      width: 52%;
      max-width: 620px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .meta-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #b8ff00;
      text-shadow: 0 0 8px rgba(184, 255, 0, 0.5);
    }

    .meta-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccff00;
      box-shadow: 0 0 8px #ccff00;
      animation: dotPulse 1s infinite alternate;
    }

    @keyframes dotPulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .meta-percent {
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #00ffd5;
      text-shadow: 0 0 10px rgba(0, 255, 213, 0.8);
      font-style: italic;
    }

    /* Track Chanfrada Estilo Fighter */
    .bar-track {
      position: relative;
      width: 100%;
      height: 12px;
      background: rgba(3, 8, 28, 0.88);
      border: 1.5px solid rgba(0, 255, 213, 0.45);
      border-radius: 2px;
      transform: skewX(-16deg);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 8px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      padding: 2px;
    }

    /* Preenchimento Dinâmico */
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b8ff00 0%, #00ffd5 100%);
      box-shadow: 0 0 18px rgba(0, 255, 213, 0.9), 0 0 30px rgba(184, 255, 0, 0.5);
      position: relative;
      transition: width 0.04s linear;
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(0, 0, 0, 0.4) 0px,
        rgba(0, 0, 0, 0.4) 6px,
        transparent 6px,
        transparent 12px
      );
      animation: stripesScroll 0.7s linear infinite;
    }

    @keyframes stripesScroll {
      0% { background-position: 0 0; }
      100% { background-position: 24px 0; }
    }

    .bar-lead {
      position: absolute;
      right: 0;
      top: -2px;
      width: 3px;
      height: calc(100% + 4px);
      background: #ffffff;
      box-shadow: 0 0 12px #ffffff, 0 0 20px #00ffd5;
    }

    /* Blocos de Glitch e Scanlines */
    .corner-glitch-bl {
      position: absolute;
      bottom: 12%;
      left: 4.5%;
      width: 12%;
      height: 24%;
      border: 1px solid rgba(200, 255, 0, 0.2);
      pointer-events: none;
      z-index: 8;
      overflow: hidden;
      mix-blend-mode: color-dodge;
      opacity: 0.7;
    }

    .corner-glitch-bl::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(204, 255, 0, 0.4) 50%, transparent 100%);
      animation: scanlineCut 2.5s ease-in-out infinite;
    }

    @keyframes scanlineCut {
      0% { transform: translateY(-100%); }
      50%, 100% { transform: translateY(200%); }
    }

    .corner-glitch-br {
      position: absolute;
      bottom: 0%;
      right: 0%;
      width: 10%;
      height: 20%;
      pointer-events: none;
      z-index: 8;
      mix-blend-mode: screen;
      opacity: 0.4;
      animation: flickerGlitch 3.5s steps(1) infinite;
    }

    @keyframes flickerGlitch {
      0%, 93%, 97% { opacity: 0.2; }
      94% { opacity: 0.9; transform: scaleX(1.15) translateX(-5px); }
      96% { opacity: 0.85; transform: scaleX(0.9) translateX(3px); }
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.3) 3px,
        rgba(0, 0, 0, 0.3) 4px
      );
      pointer-events: none;
      z-index: 20;
      opacity: 0.45;
    }

    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 21;
    }

    /* Mensagem Final de Conclusão / Abertura */
    .app-opened-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(3, 8, 28, 0.94);
      border: 2px solid #00ffd5;
      padding: 20px 40px;
      border-radius: 8px;
      z-index: 50;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 0 40px rgba(0, 255, 213, 0.6);
    }

    .app-opened-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="viewport-stage" id="stage">
    <div class="screen-wrapper" id="screenWrapper">

      <!-- Fundo Animado Geral -->
      <div class="bg-layer" id="bgLayer"></div>

      <!-- Partículas de Spray no Canvas -->
      <canvas id="particle-canvas"></canvas>

      <!-- Camada do Texto Superior (1:1 colado com profundidade 3D sutil) -->
      <div class="fg-text-layer" id="fgTextLayer">
        <div class="fg-base"></div>
        <div class="fg-shimmer"></div>
        <div class="fg-glitch glitch-cyan"></div>
        <div class="fg-glitch glitch-red"></div>
      </div>

      <!-- Barra de Carregamento Logo Abaixo do Texto -->
      <div class="loading-bar-unit">
        <div class="bar-meta">
          <div class="meta-status">
            <span class="meta-dot"></span>
            <span id="statusLabel">INICIALIZANDO PROGRAMA...</span>
          </div>
          <div class="meta-percent" id="percentLabel">0%</div>
        </div>

        <div class="bar-track">
          <div class="bar-fill" id="progressBar">
            <div class="bar-lead"></div>
          </div>
        </div>
      </div>

      <!-- Detalhes de Glitch e Scanlines -->
      <div class="corner-glitch-bl"></div>
      <div class="corner-glitch-br"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <!-- Banner exibido ao finalizar os 3 segundos (quando integrado, seu app fecha a janela aqui) -->
      <div class="app-opened-banner" id="openedBanner">
        <div style="color: #ccff00; font-size: 13px; font-weight: 700; letter-spacing: 2px; margin-bottom: 5px;">
          ● 100% CARREGADO
        </div>
        <div style="font-size: 22px; font-weight: 900; color: #00ffd5; text-shadow: 0 0 15px #00ffd5; font-style: italic;">
          PROGRAMA ABERTO COM SUCESSO!
        </div>
      </div>

    </div>
  </div>

  <script>
    // ================================================================
    // CARREGAMENTO: EXATAMENTE 3 SEGUNDOS (0% -> 100%) E ABRE O PROGRAMA
    // ================================================================
    const progressBar = document.getElementById('progressBar');
    const percentLabel = document.getElementById('percentLabel');
    const statusLabel = document.getElementById('statusLabel');
    const screenWrapper = document.getElementById('screenWrapper');
    const bgLayer = document.getElementById('bgLayer');
    const fgTextLayer = document.getElementById('fgTextLayer');
    const openedBanner = document.getElementById('openedBanner');
    const stage = document.getElementById('stage');

    const TOTAL_DURATION_MS = 2000; // 2 Segundos exatos

    function triggerGlitch() {
      screenWrapper.classList.add('is-glitching');
      setTimeout(() => {
        screenWrapper.classList.remove('is-glitching');
      }, 220);
    }

    // Inicia o ciclo único de 3 segundos
    function startLoading() {
      const startTime = performance.now();

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1.0, elapsed / TOTAL_DURATION_MS);
        const percent = Math.floor(progress * 100);

        progressBar.style.width = percent + '%';
        percentLabel.textContent = percent + '%';

        if (percent > 35 && percent < 75) {
          statusLabel.textContent = "CARREGANDO RECURSOS...";
        } else if (percent >= 75 && percent < 100) {
          statusLabel.textContent = "FINALIZANDO INICIALIZAÇÃO...";
        }

        if (progress < 1.0) {
          requestAnimationFrame(frame);
        } else {
          // 100% ATINGIDO AOS 3 SEGUNDOS CRAVADOS!
          progressBar.style.width = '100%';
          percentLabel.textContent = '100%';
          statusLabel.textContent = "PRONTO!";
          triggerGlitch();

          // 1. Dispara evento nativo para o seu programa (Python, Electron, C#, Web)
          window.dispatchEvent(new CustomEvent('loadingComplete', { detail: { ready: true } }));

          // 2. Chama função callback se definida pelo seu programa
          if (typeof window.onProgramReady === 'function') {
            window.onProgramReady();
          }

          // 3. Exibe o aviso de sucesso (no seu app final, você pode fechar a janela do splash aqui)
          openedBanner.classList.add('show');
          console.log("[FIGHT PORT 4] Carregamento de 3s concluído. Abrindo o programa!");
        }
      }

      requestAnimationFrame(frame);
    }

    // Inicia a contagem no momento em que a tela abre
    startLoading();

    // ================================================================
    // MOVIMENTAÇÃO PARALLAX SUTIL (Camadas Coladas e Conectadas)
    // ================================================================
    stage.addEventListener('mousemove', (e) => {
      const rect = stage.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      // Fundo se move com sensibilidade 4px
      bgLayer.style.transform = `translate(${x * 4}px, ${y * 4}px) scale(1.02)`;
      // Texto da frente se move apenas 2px a mais (extremamente próximo, sem separar!)
      fgTextLayer.style.transform = `translate(${x * 6}px, ${y * 6}px) scale(1.02)`;
    });

    stage.addEventListener('mouseleave', () => {
      bgLayer.style.transform = 'translate(0px, 0px) scale(1.0)';
      fgTextLayer.style.transform = 'translate(0px, 0px) scale(1.0)';
    });

    // Glitch aleatório rápido durante os 3 segundos
    setTimeout(() => { triggerGlitch(); }, 1200);
    setTimeout(() => { triggerGlitch(); }, 2400);

    // ================================================================
    // PARTÍCULAS CANVAS (Fagulhas e Névoa de Spray)
    // ================================================================
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const colors = ['rgba(204, 255, 0, ', 'rgba(0, 255, 213, ', 'rgba(255, 255, 255, '];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.2 + 0.8,
        speedY: Math.random() * 0.6 + 0.3,
        speedX: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.7 + 0.2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        p.y -= p.speedY;
        p.x += p.speedX;
        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
